# PrusaSlicer config - Creality Ender-5 S1 + PLA+ (Klipper via START_PRINT/END_PRINT)
# Temps set for the eSUN PLA+ spool loaded 2026-09-06; most PLA+ brands share the
# 210-230 C range, so check the label if the brand changes.
# Derived from ender5s1_pla.ini 2026-09-06. ONLY the temperatures differ.
#
# PLA+ IS NOT PLA. It is a PLA base resin with impact modifiers blended in: notably
# tougher and better layer adhesion than plain PLA, but the glass transition is
# essentially unchanged at ~55-60 C, so it buys NO extra heat resistance. It also runs
# HOTTER - eSUN's datasheet range is 210-230 C nozzle, 45-60 C bed. Running PLA+ at plain
# PLA temperatures (the 210/205 in ender5s1_pla.ini) under-fuses it and throws away the
# layer adhesion that is the entire point of the "+".
#
# Temps below are the middle of eSUN's stated range, not measured on this machine.
# A temperature tower is the proper answer and is backlogged.
# VALIDATED 2026-09-06 on the SO-ARM101 Motor_holder_Base print - first PLA of any
# kind on this machine. Laid down clean with no babystep and no adjustment.
printer_technology = FFF
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 280
gcode_flavor = marlin2
use_relative_e_distances = 1
start_gcode = M140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nSTART_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
filament_diameter = 1.75
filament_density = 1.24
filament_type = PLA
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 10
layer_height = 0.2
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
first_layer_speed = 20
perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 60
travel_speed = 150
skirts = 2
skirt_distance = 3
layer_gcode = G92 E0
