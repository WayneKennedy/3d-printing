# Derived from ender5s1_petg.ini, changing ONLY layer_height 0.2 -> 0.16 (first layer
# unchanged). Figurines: at 0.2 mm layer lines show as banding on curved surfaces. PETG
# variant for figures printed in their final colour, unpainted (The Thing, orange PETG,
# 2026-09-09). See docs/decisions.md#superhero-figures. Not for functional parts.
printer_technology = FFF
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 280
gcode_flavor = marlin2
use_relative_e_distances = 1
start_gcode = M140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nSTART_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
filament_diameter = 1.75
filament_density = 1.27
filament_type = PETG
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
fan_always_on = 1
min_fan_speed = 40
max_fan_speed = 50
disable_fan_first_layers = 3
slowdown_below_layer_time = 8
min_print_speed = 10
layer_height = 0.16
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
first_layer_speed = 20
perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 60
travel_speed = 150
skirts = 2
skirt_distance = 3
layer_gcode = G92 E0
