# PrusaSlicer config - Creality Ender-5 S1 + TPU 95A (Klipper via START_PRINT/END_PRINT)
# UNTESTED, created 2026-09-21 from ender5s1_petg.ini for Reprapper Silk TPU, yellow, 1.75 mm,
# batch 20260407S01. Every value below is a starting point, not a measurement: the calibration
# plan in 3d-printing docs/open-questions.md (TPU profile) replaces them one by one.
# - 215/220 C: inside the overlap of the label (205-230) and listing (180-220). Tower decides.
# - Retraction short, slow, no wipe, no lift: TPU buckles under fast retraction in the extruder.
# - max_volumetric_speed caps every feature; 2.5 mm3/s is conservative for 95A direct drive.
# - Bed 50 C on PEI WITH A GLUE-STICK RELEASE LAYER: TPU can tear coating off PEI on removal.
# - start_gcode keeps the literal M104/M190 tokens (AGENTS.md: load-bearing).
printer_technology = FFF
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 280
gcode_flavor = marlin2
use_relative_e_distances = 1
start_gcode = M140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nSTART_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT
retract_length = 0.4
retract_speed = 20
deretract_speed = 20
retract_lift = 0
retract_before_travel = 2
retract_layer_change = 0
wipe = 0
filament_diameter = 1.75
filament_density = 1.21
filament_type = FLEX
temperature = 215
first_layer_temperature = 220
bed_temperature = 50
first_layer_bed_temperature = 50
fan_always_on = 1
min_fan_speed = 30
max_fan_speed = 50
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 10
layer_height = 0.2
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
first_layer_speed = 15
perimeter_speed = 20
external_perimeter_speed = 15
infill_speed = 25
travel_speed = 150
skirts = 2
skirt_distance = 3
layer_gcode = G92 E0
solid_infill_speed = 20
top_solid_infill_speed = 15
bridge_speed = 15
gap_fill_speed = 15
max_volumetric_speed = 2.5
avoid_crossing_perimeters = 1
