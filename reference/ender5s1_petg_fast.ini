# PrusaSlicer config - Creality Ender-5 S1 + PETG, fidelity-first FAST variant (Klipper via START_PRINT/END_PRINT)
printer_technology = FFF
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 280
gcode_flavor = marlin
use_relative_e_distances = 1
start_gcode = M140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nSTART_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
filament_diameter = 1.75
filament_density = 1.27
filament_type = PETG
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 80
fan_always_on = 1
min_fan_speed = 40
max_fan_speed = 50
disable_fan_first_layers = 3
slowdown_below_layer_time = 8
min_print_speed = 10
layer_height = 0.2
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
first_layer_speed = 20
perimeter_speed = 80
external_perimeter_speed = 50
infill_speed = 120
travel_speed = 250
skirts = 2
skirt_distance = 3
layer_gcode = G92 E0
brim_width = 0
# petg_fast (2026-09-23): petg with fidelity-first speeds - see 3d-printing docs/open-questions.md#print-speed
solid_infill_speed = 80
top_solid_infill_speed = 50
gap_fill_speed = 40
bridge_speed = 40
max_volumetric_speed = 8
default_acceleration = 3000
perimeter_acceleration = 2500
infill_acceleration = 5000
bridge_acceleration = 1000
first_layer_acceleration = 1000
machine_max_acceleration_extruding = 5000,5000
machine_max_acceleration_x = 5000,5000
machine_max_acceleration_y = 5000,5000
machine_max_acceleration_travel = 5000,5000
machine_max_feedrate_x = 300,300
machine_max_feedrate_y = 300,300
