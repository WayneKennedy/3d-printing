# 5P -- Creality Ender-5 Plus (Creality V2.2 board, ATmega2560) with Micro Swiss NG direct drive,
# all-metal hotend and ANTCLABS BLTouch Smart V3.x. Second Klipper instance on printhub
# (5SI, the Ender-5 S1, is ~/printer_data). Pins: Klipper official sample
# printer-creality-ender5plus-2019.cfg, copied verbatim below this header.
# NOT YET CALIBRATED (2026-09-28) -- 3d-printing docs/open-questions.md, Ender-5 Plus:
#   [extruder] sensor_type is the sample's EPCOS 100K -- unconfirmed for this hotend;
#   PID values are the sample's -- re-tune.

[include mainsail.cfg]

[virtual_sdcard]
path: ~/printer_data_5p/gcodes

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 350
position_max: 350
homing_speed: 100

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 350
position_max: 350
homing_speed: 100

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: 0
homing_speed: 10.0

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 7.670   # measured 2026-09-28, Micro Swiss NG: 33.683 fed 23 of 100 mm; 7.747 fed 99 of 100 (green PETG, 240 C, 1 mm/s)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
#control: pid
#pid_Kp: 22.2
#pid_Ki: 1.08
#pid_Kd: 114
min_temp: 0
max_temp: 260

[safe_z_home]
home_xy_position: 216, 189   # nozzle here puts the probe (-41,-14) at bed centre 175,175
speed: 100
z_hop: 10
z_hop_speed: 5

[bltouch]
sensor_pin: ^PD3
control_pin: PB5
# measured 2026-09-28 (owner, pen mark): pin 41 mm left of and 14 mm in front of the nozzle
x_offset: -41
y_offset: -14
#z_offset: 0
speed: 3.0
pin_up_touch_mode_reports_triggered: False

[bed_mesh]
speed: 100
horizontal_move_z: 8
# probe coordinates; probe reach is X -41..309, Y -14..336 (offsets -41,-14)
mesh_min: 15, 15
mesh_max: 305, 330
probe_count: 7, 7
algorithm: bicubic   # lagrange (default) is limited to 6 x 6

[screws_tilt_adjust]
# Bed corner screws located 2026-09-28 by pen/pin (owner): FL (16,38), BL (16,296),
# BR ~(329,296), FR assumed (329,38) by symmetry. Coordinates below are NOZZLE positions
# that put the probe (offset -41,-14) over each screw; the right pair are probed at the
# probe reach limit (bed X 309), 20 mm inboard. Thread M4 assumed, not verified.
screw1: 57, 52
screw1_name: front left
screw2: 57, 310
screw2_name: back left
screw3: 350, 310
screw3_name: back right
screw4: 350, 52
screw4_name: front right
horizontal_move_z: 8
speed: 100
screw_thread: CW-M4

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
#control: pid
#pid_Kp: 690.34
#pid_Ki: 111.47
#pid_Kd: 1068.83
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AG0KDTIL-if00-port0

[filament_switch_sensor filament_sensor]
switch_pin:PE4

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2500
max_z_velocity: 5
max_z_accel: 100


# --- Macros (2026-09-28): same contract as 5SI's START_PRINT/END_PRINT; purge and park moved for
# the 350 bed. The purge runs at Y8/Y8.5, outside the mesh area (bed Y15-330) that slicers place parts in.
[gcode_macro START_PRINT]
description: Bed to temp first, hotend last (minimises ooze). Params EXTRUDER_TEMP/BED_TEMP (default PETG 240/80)
gcode:
    {% set bed = params.BED_TEMP|default(80)|float %}
    {% set hot = params.EXTRUDER_TEMP|default(240)|float %}
    M140 S{bed}
    M190 S{bed}
    G28
    BED_MESH_PROFILE LOAD=default
    M109 S{hot}
    G90
    G92 E0
    G1 Z2.0 F600
    G1 X15 Y8 F6000
    G1 Z0.24 F300
    M83
    G1 X205 Y8 E8.5 F900
    G1 X205 Y8.5 E0.03 F900
    G1 X15 Y8.5 E8.5 F900
    G92 E0
    G1 E-0.5 F1800

[gcode_macro END_PRINT]
description: Cool, retract, lower the bed 10 mm, park the head at the back, motors off
gcode:
    M104 S0
    M140 S0
    M107
    M83
    G1 E-2 F1800
    G91
    G1 Z10 F600
    G90
    G1 Y340 F6000
    M84

[gcode_macro PRINT_START]
description: Alias -> START_PRINT
gcode:
    START_PRINT {rawparams}

[gcode_macro PRINT_END]
description: Alias -> END_PRINT
gcode:
    END_PRINT

