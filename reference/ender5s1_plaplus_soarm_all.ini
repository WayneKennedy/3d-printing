# Derived from ender5s1_plaplus_soarm.ini, changing ONLY support_material_buildplate_only 1 -> 0.
# Purpose: parts with an overhang that sits ABOVE THE PART (not the bed), which
# buildplate_only silently drops so the face prints into air. Wrist_Roll_Pitch
# fork face, plate 3, 2026-09-08: 758 mm2 of fork face at Z45-50 over the lower
# tine, zero support emitted above Z44.8, face unusable. Costs support inside
# horizontal bores again, which is the thing buildplate_only exists to avoid, so
# use this only for parts that need it. See docs/decisions.md#supports.
printer_technology = FFF
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 280
gcode_flavor = marlin2
use_relative_e_distances = 1
start_gcode = M140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nSTART_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
filament_diameter = 1.75
filament_density = 1.24
filament_type = PLA
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 10
layer_height = 0.2
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
first_layer_speed = 20
perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 60
travel_speed = 150
skirts = 2
skirt_distance = 3
layer_gcode = G92 E0
support_material = 1
support_material_auto = 1
support_material_threshold = 45
support_material_style = snug
support_material_buildplate_only = 0
support_material_contact_distance = 0.25
