# 5P -- Creality Ender-5 Plus (Creality V2.2 board, ATmega2560) with Micro Swiss NG direct drive,
# all-metal hotend and ANTCLABS BLTouch Smart V3.x. Second Klipper instance on printhub
# (5SI, the Ender-5 S1, is ~/printer_data). Pins: Klipper official sample
# printer-creality-ender5plus-2019.cfg, copied verbatim below this header.
# NOT YET CALIBRATED (2026-09-28) -- 3d-printing docs/open-questions.md, Ender-5 Plus:
#   [extruder] rotation_distance is the STOCK Bowden value -- wrong for the NG, measure it;
#   [extruder] sensor_type is the sample's EPCOS 100K -- unconfirmed for this hotend;
#   PID values are the sample's -- re-tune.

[include mainsail.cfg]

[virtual_sdcard]
path: ~/printer_data_5p/gcodes

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 350
position_max: 350
homing_speed: 100

[stepper_y]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 350
position_max: 350
homing_speed: 100

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 4
endstop_pin: probe:z_virtual_endstop
position_max: 400
position_min: 0
homing_speed: 10.0

[extruder]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 33.683
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 260

[safe_z_home]
home_xy_position: 180, 180
speed: 100
z_hop: 10
z_hop_speed: 5

[bltouch]
sensor_pin: ^PD3
control_pin: PB5
# measured 2026-09-28 (owner, pen mark): pin 41 mm left of and 14 mm in front of the nozzle
x_offset: -41
y_offset: -14
#z_offset: 0
speed: 3.0
pin_up_touch_mode_reports_triggered: False

[bed_mesh]
speed: 100
horizontal_move_z: 8
mesh_min: 50, 50
mesh_max: 300, 300
probe_count: 3, 3

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: pid
pid_Kp: 690.34
pid_Ki: 111.47
pid_Kd: 1068.83
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[mcu]
serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_AG0KDTIL-if00-port0

[filament_switch_sensor filament_sensor]
switch_pin:PE4

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2500
max_z_velocity: 5
max_z_accel: 100

