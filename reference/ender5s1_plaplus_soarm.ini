# PrusaSlicer config - Ender-5 S1 + PLA+ for SO-ARM101 parts THAT NEED SUPPORT.
# Derived from ender5s1_plaplus.ini, adding ONLY support settings.
#
# USE THIS PROFILE FOR ONLY 6 OF THE 11 FOLLOWER PARTS. Measured overhang area
# (faces whose slope is under 45 deg from horizontal, excluding the face on the bed):
#
#   Moving_Jaw 14.0%   Rotation_Pitch 11.2%   Wrist_Roll_Pitch 8.3%
#   Wrist_Roll_Follower 5.5%   Under_arm 4.2%   Upper_arm 3.8%      <- this profile
#   ------------------------------------------------------------------
#   WaveShare_Mounting_Plate 1.7%   Motor_holder_Base 1.3%
#   Base_motor_holder 1.2%   Motor_holder_Wrist 1.1%   Base 0.5%    <- plain plaplus
#
# The five low-overhang parts get supports that hold up almost nothing while adding
# ~29% material and time. Motor_holder_Base was printed with supports on 2026-09-06
# and the result was support walls bonded to vertical faces and inside horizontal
# screw holes, serving no purpose and not cleaning off. Slice those with the plain
# ender5s1_plaplus.ini instead.
#
# Why these three settings, all measured on Rotation_Pitch (51.3 g grid-everywhere):
#   style = snug              47.0 g. PrusaSlicer's own help: snug towers "save material
#                             and reduce object scarring". grid projects a full-height
#                             tower footprint whether the part needs it or not.
#   buildplate_only = 1       42.6 g. THIS is the fix for support inside horizontal screw
#                             holes, which the SO-101 README asks for and which cannot be
#                             done with support blockers headlessly. Support in a bore
#                             rests on the part, not the bed, so this switch drops it.
#   contact_distance = 0.25   0.2 is PrusaSlicer's default, not an improvement; 0.25 is.
#
# NOTE: tree/organic supports are NOT available here. PrusaSlicer on printhub is 2.5.0
# and organic supports arrived in 2.6. snug is the closest this version offers.
printer_technology = FFF
nozzle_diameter = 0.4
bed_shape = 0x0,220x0,220x220,0x220
max_print_height = 280
gcode_flavor = marlin2
use_relative_e_distances = 1
start_gcode = M140 S[first_layer_bed_temperature]\nM190 S[first_layer_bed_temperature]\nM104 S[first_layer_temperature]\nSTART_PRINT EXTRUDER_TEMP=[first_layer_temperature] BED_TEMP=[first_layer_bed_temperature]
end_gcode = END_PRINT
retract_length = 0.8
retract_speed = 40
deretract_speed = 40
retract_lift = 0.2
retract_before_travel = 1
retract_layer_change = 1
wipe = 1
filament_diameter = 1.75
filament_density = 1.24
filament_type = PLA
temperature = 215
first_layer_temperature = 220
bed_temperature = 60
first_layer_bed_temperature = 60
fan_always_on = 1
min_fan_speed = 100
max_fan_speed = 100
disable_fan_first_layers = 1
slowdown_below_layer_time = 8
min_print_speed = 10
layer_height = 0.2
first_layer_height = 0.24
perimeters = 3
top_solid_layers = 4
bottom_solid_layers = 4
fill_density = 15%
fill_pattern = grid
first_layer_speed = 20
perimeter_speed = 45
external_perimeter_speed = 30
infill_speed = 60
travel_speed = 150
skirts = 2
skirt_distance = 3
layer_gcode = G92 E0
support_material = 1
support_material_auto = 1
support_material_threshold = 45
support_material_style = snug
support_material_buildplate_only = 1
support_material_contact_distance = 0.25
